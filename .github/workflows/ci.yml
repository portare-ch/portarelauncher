# Build on arm64 with warnings as errors; test normally and with ASan/UBSan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install libdrm headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdrm-dev cmake python3-yaml mame-tools

      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Tests
        run: make test

      - name: PlayStation helper and title generator fixtures
        run: make test-chd

      - name: Tests under ASan and UBSan
        run: make test SAN=1

      - name: PlayStation decoder under ASan and UBSan
        run: make test-chd-san
