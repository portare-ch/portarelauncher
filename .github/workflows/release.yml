# Publishes a release for every version tag (v0.1.0, v0.2.0, ...).
#
# The tarball is made here, once, with git archive, and uploaded with its
# checksum. PortareOS pins that file by version and sha256, so the file must
# never change after publication. GitHub's own "Source code" archives are
# generated on demand and are not something to hang a checksum on.
#
# The same build and tests as CI run first, so a tag that does not build
# publishes nothing.
#
# A release made on the GitHub page first (which also creates the tag) is
# fine: the files are added to it rather than a second one being refused.
# Run it by hand with a tag to (re)publish an existing one; a re-run would
# use the workflow as it was at that tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0     # git describe, for the version the binary shows

      - name: Install libdrm headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdrm-dev

      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Tests
        run: make test

      - name: Tests under ASan and UBSan
        run: make test SAN=1

      - name: Tarball
        run: |
          VER="${TAG#v}"
          mkdir dist
          # The prefix is the directory PortareOS's build unpacks into:
          # ${PKG_NAME}-${PKG_VERSION}.
          git archive --format=tar.gz --prefix="portarelauncher-${VER}/" \
            -o "dist/portarelauncher-${VER}.tar.gz" "${TAG}"
          # The tag has to reach VERSION, or the launcher shows "dev".
          tar -xzOf "dist/portarelauncher-${VER}.tar.gz" \
            "portarelauncher-${VER}/VERSION" | grep -qx "${TAG}"
          (cd dist && sha256sum "portarelauncher-${VER}.tar.gz" \
            > "portarelauncher-${VER}.tar.gz.sha256")
          cat dist/*.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --verify-tag --generate-notes --title "${TAG}"
          fi
