# Publish a tested git archive and SHA-256 checksum for each version tag.
# PortareOS pins these assets, so published archives must remain stable.
# Manual runs can add assets to an existing release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0     # git describe, for the version the binary shows

      - name: Install libdrm headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdrm-dev

      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Tests
        run: make test

      - name: Tests under ASan and UBSan
        run: make test SAN=1

      - name: Tarball
        run: |
          VER="${TAG#v}"
          mkdir dist
          # Match PortareOS's extraction directory: ${PKG_NAME}-${PKG_VERSION}.
          git archive --format=tar.gz --prefix="portarelauncher-${VER}/" \
            -o "dist/portarelauncher-${VER}.tar.gz" "${TAG}"
          # The tag has to reach VERSION, or the launcher shows "dev".
          tar -xzOf "dist/portarelauncher-${VER}.tar.gz" \
            "portarelauncher-${VER}/VERSION" | grep -qx "${TAG}"
          (cd dist && sha256sum "portarelauncher-${VER}.tar.gz" \
            > "portarelauncher-${VER}.tar.gz.sha256")
          cat dist/*.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --verify-tag --generate-notes --title "${TAG}"
          fi
